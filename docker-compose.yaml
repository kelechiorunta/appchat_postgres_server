version: '3.9'

services:

  appchat_backend_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: appchat_backend_server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    expose:
      - 5467
    depends_on:
      db:
        condition: service_healthy
  db:
   image: postgres
   container_name: appchat
   restart: always
   ports:
     - 5441:5432
   environment:
    POSTGRES_PASSWORD: ${DB_PWD}
    POSTGRES_USER: ${DB_USER}
    POSTGRES_DB: ${DB_NAME}
   volumes: 
    - pgdata:/var/lib/postgresql/18/docker
   healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    
  db_client:
    image: adminer
    restart: always
    ports:
      - 8084:8080
    volumes:
     - pgdata:/var/lib/postgresql/18/docker
  
volumes: 
  pgdata: